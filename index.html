<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>២៥ រៀលធី | ទម្រង់ព័ត៌មានអតិថិជនស្វែងរកអចលនទ្រព្យ</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Kantumruy Pro", "Hanuman", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 30px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 14px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    label .required {
      color: #ef4444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .segmented-control {
      display: flex;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }

    .segmented-control input[type="radio"] {
      display: none;
    }

    .segmented-control label {
      flex: 1;
      text-align: center;
      padding: 10px;
      margin-bottom: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .segmented-control input[type="radio"]:checked + label {
      background-color: var(--primary);
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }

    button.btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Logo Header -->
    <div class="logo-container">
      <div class="brand-logo">25R</div>
    </div>

    <div class="header">
      <h1>📋 ទម្រង់ព័ត៌មានអតិថិជនស្វែងរកអចលនទ្រព្យ<br><span style="font-size: 0.95rem; font-weight: 500;">(Client Inquiry Form)</span></h1>
      <p>សូមបំពេញព័ត៌មានខាងក្រោម ដើម្បីឲ្យក្រុមការងារជួយស្វែងរកអចលនទ្រព្យជូនអ្នក<br>Please fill in the form below so our team can assist you.</p>
    </div>

    <form id="inquiryForm">

      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">ឈ្មោះអតិថិជន / Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" placeholder="ឧទាហរណ៍៖ សុខ ជា / Sok Chea" required>
      </div>

      <!-- Phones -->
      <div class="row">
        <div class="form-group">
          <label for="phone">លេខទូរស័ព្ទទី១ / Tel 1 <span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="012 345 678" required>
        </div>
        <div class="form-group">
          <label for="phone2">លេខទូរស័ព្ទទី២ / Tel 2</label>
          <input type="tel" id="phone2" placeholder="098 765 432">
        </div>
      </div>

      <!-- Telegram Account -->
      <div class="form-group">
        <label for="telegramAccount">គណនី Telegram / Telegram Account <span class="required">*</span></label>
        <input type="text" id="telegramAccount" placeholder="@username ឬ លេខទូរស័ព្ទ" required>
      </div>

      <!-- Target: Buy or Rent -->
      <div class="form-group">
        <label>គោលបំណង / Purpose <span class="required">*</span></label>
        <div class="segmented-control">
          <input type="radio" id="targetRent" name="target" value="Rent" checked>
          <label for="targetRent">ជួល / Rent</label>

          <input type="radio" id="targetBuy" name="target" value="Buy">
          <label for="targetBuy">ទិញ / Buy</label>
        </div>
      </div>

      <!-- Property Type -->
      <div class="form-group">
        <label for="propertyType">ប្រភេទអចលនទ្រព្យ / Property Type <span class="required">*</span></label>
        <select id="propertyType" required>
          <option value="">-- ជ្រើសរើស / Select Type --</option>
          <option value="House">ផ្ទះអាជីវកម្ម / ផ្ទះល្វែង (House)</option>
          <option value="Villa">វីឡា (Villa)</option>
          <option value="Condo">ខុនដូ / អាផាតមិន (Condo)</option>
          <option value="Land">ដី (Land)</option>
          <option value="Warehouse">ឃ្លាំង / រោងចក្រ (Warehouse)</option>
        </select>
      </div>

      <!-- Dynamic Land / Building Sizes -->
      <div class="row hidden" id="sizeRow">
        <div class="form-group hidden" id="landSizeGroup">
          <label for="landSize">ទំហំដី / Land Size</label>
          <input type="text" id="landSize" placeholder="ឧ. 10m x 20m">
        </div>
        <div class="form-group hidden" id="buildingSizeGroup">
          <label for="buildingSize">ទំហំអគារ / Building Size</label>
          <input type="text" id="buildingSize" placeholder="ឧ. 8m x 15m">
        </div>
      </div>

      <!-- Locations -->
      <div class="row">
        <div class="form-group">
          <label for="location">ទីតាំងទី១ / Location 1 <span class="required">*</span></label>
          <input type="text" id="location" placeholder="ឧ. ទួលគោក / Toul Kork" required>
        </div>
        <div class="form-group">
          <label for="location2">ទីតាំងទី២ / Location 2</label>
          <input type="text" id="location2" placeholder="ឧ. បឹងកេងកង / BKK">
        </div>
      </div>

      <!-- Price Range -->
      <div class="row">
        <div class="form-group">
          <label for="minPrice">ថវិកាអប្បបរមា / Min Price ($)</label>
          <input type="number" id="minPrice" placeholder="500">
        </div>
        <div class="form-group">
          <label for="maxPrice">ថវិកាអតិបរមា / Max Price ($)</label>
          <input type="number" id="maxPrice" placeholder="2000">
        </div>
      </div>

      <!-- Spec details -->
      <div class="row">
        <div class="form-group">
          <label for="bedrooms">បន្ទប់គេង / Bedrooms</label>
          <select id="bedrooms">
            <option value="Any">មិនកំណត់ / Any</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4+">4+</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bathrooms">បន្ទប់ទឹក / Bathrooms</label>
          <select id="bathrooms">
            <option value="Any">មិនកំណត់ / Any</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4+">4+</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="parking">ចំណតរថយន្ត / Parking</label>
          <select id="parking">
            <option value="Not Specified">មិនកំណត់ / Any</option>
            <option value="Car">រថយន្ត / Car</option>
            <option value="Moto">ម៉ូតូ / Moto</option>
            <option value="Both">ទាំងពីរ / Both</option>
          </select>
        </div>
        <div class="form-group">
          <label for="direction">បែរមុខទៅ / Direction</label>
          <select id="direction">
            <option value="Any">មិនកំណត់ / Any</option>
            <option value="North">ជើង / North</option>
            <option value="South">ត្បូង / South</option>
            <option value="East">កើត / East</option>
            <option value="West">លិច / West</option>
            <option value="Northeast">កើតឈៀងជើង / Northeast</option>
            <option value="Southeast">កើតឈៀងត្បូង / Southeast</option>
            <option value="Northwest">លិចឈៀងជើង / Northwest</option>
            <option value="Southwest">លិចឈៀងត្បូង / Southwest</option>
          </select>
        </div>
      </div>

      <!-- Additional Notes -->
      <div class="form-group">
        <label for="notes">ព័ត៌មានបន្ថែម / Additional Notes</label>
        <textarea id="notes" rows="3" placeholder="បញ្ជាក់ព័ត៌មានបន្ថែមប្រសិនជាមាន..."></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="submitBtn">ផ្ញើព័ត៌មាន / Submit Inquiry</button>

    </form>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const propertyTypeSelect = document.getElementById('propertyType');
    const sizeRow = document.getElementById('sizeRow');
    const landSizeGroup = document.getElementById('landSizeGroup');
    const buildingSizeGroup = document.getElementById('buildingSizeGroup');

    propertyTypeSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'Land') {
        sizeRow.classList.remove('hidden');
        landSizeGroup.classList.remove('hidden');
        buildingSizeGroup.classList.add('hidden');
      } else if (val === 'Warehouse' || val === 'House' || val === 'Villa') {
        sizeRow.classList.remove('hidden');
        landSizeGroup.classList.remove('hidden');
        buildingSizeGroup.classList.remove('hidden');
      } else {
        sizeRow.classList.add('hidden');
        landSizeGroup.classList.add('hidden');
        buildingSizeGroup.classList.add('hidden');
      }
    });

    const form = document.getElementById('inquiryForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'កំពុងផ្ញើ... / Sending...';

      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

      const now = new Date();
      const formattedDate = now.toLocaleString('en-GB', { timeZone: 'Asia/Phnom_Penh' });

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        phone2: document.getElementById('phone2').value.trim(),
        telegramAccount: document.getElementById('telegramAccount').value.trim(),
        target: document.querySelector('input[name="target"]:checked').value,
        propertyType: propertyTypeSelect.value,
        landSize: document.getElementById('landSize').value.trim(),
        buildingSize: document.getElementById('buildingSize').value.trim(),
        location: document.getElementById('location').value.trim(),
        location2: document.getElementById('location2').value.trim(),
        minPrice: document.getElementById('minPrice').value || '0',
        maxPrice: document.getElementById('maxPrice').value || '0',
        bedrooms: document.getElementById('bedrooms').value,
        bathrooms: document.getElementById('bathrooms').value,
        parking: document.getElementById('parking').value,
        direction: document.getElementById('direction').value,
        notes: document.getElementById('notes').value.trim(),
        submittedAt: formattedDate,
        chat_id: user ? user.id : null,
        tgUserId: user ? user.id : null,
        tgUsername: user ? user.username : '',
        tgFirstName: user ? user.first_name : '',
        tgLastName: user ? user.last_name : ''
      };

      try {
        const res = await fetch('/submit-form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          if (tg) {
            tg.close();
          } else {
            alert('ព័ត៌មានត្រូវបានផ្ញើដោយជោគជ័យ! សូមអរគុណ / Inquiry submitted successfully!');
            form.reset();
          }
        } else {
          alert('មានបញ្ហាក្នុងការផ្ញើ សូមព្យាយាមម្តងទៀត / Error submitting form, please try again.');
        }
      } catch (err) {
        console.error('Submission Error:', err);
        alert('មានបញ្ហាបច្ចេកទេស សូមព្យាយាមម្តងទៀត / Technical error, please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'ផ្ញើព័ត៌មាន / Submit Inquiry';
      }
    });
  </script>
</body>
</html>
